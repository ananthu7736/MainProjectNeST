@if (!isAdminRoute()) {
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-success" routerLink="">🛒 INSTAMART</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="">HOME</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="product">PRODUCTS</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="orders">ORDERS</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="about">ABOUT</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="contact">CONTACT</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <form class="d-flex m-0" role="search">
            <input class="form-control me-2 rounded-pill bg-secondary text-white border-0 px-3" type="search" placeholder="Search products..." aria-label="Search"/>
          </form>

          @if (authService.currentUser()) {
            <div class="dropdown">
              <button class="btn btn-outline-light rounded-pill px-3 dropdown-toggle d-flex align-items-center gap-2 fw-semibold" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span>👤</span>
                <span>{{ authService.currentUser()?.name }}</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><span class="dropdown-item-text text-muted small">Signed in as <strong>{{ authService.currentUser()?.email }}</strong></span></li>
                <li><hr class="dropdown-divider"></li>
                <li><a routerLink="orders" class="dropdown-item fw-semibold d-flex align-items-center gap-2"><i class="bi bi-bag"></i> My Orders</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><button class="dropdown-item text-danger fw-semibold d-flex align-items-center gap-2" (click)="logout()"><span>🚪</span> Sign Out</button></li>
              </ul>
            </div>
          } @else {
            <a routerLink="login" class="btn btn-outline-success rounded-pill px-3 fw-bold d-flex align-items-center gap-1">
              <span>🔑</span>
              <span>Login</span>
            </a>
          }

          <a routerLink="cart" class="btn btn-success rounded-pill px-3 d-flex align-items-center gap-2 fw-bold position-relative">
            <span>🛒</span>
            <span>Cart</span>
            @if (cartService.cartCount() > 0) {
              <span class="badge bg-danger rounded-circle position-absolute top-0 start-100 translate-middle">
                {{ cartService.cartCount() }}
              </span>
            }
          </a>
        </div>
      </div>
    </div>
  </nav>
}
