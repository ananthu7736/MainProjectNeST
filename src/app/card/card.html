<div class="card" style="width: 18rem;">
  <img [src]="product.thumbnail"
       class="card-img-top"
       alt="Product Image">

  <div class="card-body">
    <h5 class="card-title">{{ product.title }}</h5>

    <p class="card-text">
      {{ product.description }}
    </p>

    <p class="card-price">
      ₹{{ product.price }}
    </p>

    <div class="d-flex justify-content-between gap-2 mt-3">
      <a class="btn btn-outline-primary view-btn w-50"
         [routerLink]="['/productdetails', product.id]">
        Details
      </a>
      <button class="btn btn-success add-btn w-50" (click)="addToCart($event)">
        Add 🛒
      </button>
    </div>

  </div>
</div>
