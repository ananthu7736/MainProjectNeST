<div class="card" style="width: 18rem;">
  <img [src]="product.thumbnail"
       class="card-img-top"
       alt="Product Image">

  <div class="card-body">
    <h5 class="card-title">{{ product.title }}</h5>

    <p class="card-text">
      {{ product.description }}
    </p>

    <p class="card-price">
      ₹{{ product.price }}
    </p>

    <a class="btn btn-primary view-btn"
       [routerLink]="['/productdetails', product.id]">
      View Details
    </a>

  </div>
</div>
