<div class="container contact-section mt-5 mb-5">

    <div class="text-center mb-5">

        <h1 class="contact-title">
            Contact InstaMart
        </h1>

        <p class="contact-subtitle">

            We are here to help you with fast grocery
            delivery and customer support services.

        </p>

    </div>

    <div class="row">

        <div class="col-lg-5 mb-4">

            <div class="contact-info shadow">

                <h2 class="mb-4 text-success">
                    Contact Information
                </h2>

                <p>
                    📍 <strong>Address:</strong><br>
                    InstaMart Delivery Hub,<br>
                    Kochi, Kerala, India
                </p>

                <p>
                    📞 <strong>Phone:</strong><br>
                    +91 9876543210
                </p>

                <p>
                    ✉️ <strong>Email:</strong><br>
                    support@instamart.com
                </p>

                <p>
                    🕒 <strong>Working Hours:</strong><br>
                    24 x 7 Fast Delivery Service
                </p>

            </div>

        </div>

        <div class="col-lg-7">

            <div class="contact-form shadow">

                <h2 class="mb-4 text-success">
                    Send Message
                </h2>

                <form>

                    <div class="mb-3">

                        <input
                        type="text"
                        class="form-control"
                        placeholder="Enter Your Name">

                    </div>

                    <div class="mb-3">

                        <input
                        type="email"
                        class="form-control"
                        placeholder="Enter Your Email">

                    </div>

                    <div class="mb-3">

                        <input
                        type="text"
                        class="form-control"
                        placeholder="Enter Subject">

                    </div>

                    <div class="mb-3">

                        <textarea
                        rows="5"
                        class="form-control"
                        placeholder="Enter Your Message"></textarea>

                    </div>

                    <button class="btn btn-success btn-lg w-100">

                        Send Message

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
