<div class="login-container d-flex align-items-center justify-content-center py-5">
  <div class="auth-card shadow-lg">
    <!-- Brand Header -->
    <div class="card-header text-center border-0 pt-4 pb-2 bg-transparent">
      <div class="brand-logo mb-2">🛒 INSTAMART</div>
      <p class="text-muted small">Your 15-Minute Grocery & Essentials Hub</p>
    </div>

    <!-- Tab Switcher -->
    <div class="tab-switcher d-flex mx-4 mb-4 p-1 rounded-pill bg-light">
      <button class="btn flex-fill rounded-pill py-2 fw-semibold transition-all" [class.active-tab]="mode === 'login'"
        (click)="toggleMode('login')">
        Sign In
      </button>
      <button class="btn flex-fill rounded-pill py-2 fw-semibold transition-all"
        [class.active-tab]="mode === 'register'" (click)="toggleMode('register')">
        Create Account
      </button>
    </div>

    <div class="card-body px-4 pb-4">
      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show rounded-3 text-center small py-2"
        role="alert">
        <span>⚠️ {{ errorMessage }}</span>
      </div>

      <!-- Success Alert -->
      <div *ngIf="successMessage"
        class="alert alert-success alert-dismissible fade show rounded-3 text-center small py-2" role="alert">
        <span>✅ {{ successMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()">
        <!-- Name Field (Register mode only) -->
        <div *ngIf="mode === 'register'" class="mb-3">
          <label class="form-label text-secondary fw-semibold small">Full Name <span
              class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">👤</span>
            <input type="text" class="form-control bg-light border-start-0 ps-0" placeholder="Enter your name"
              [(ngModel)]="name" name="name" required />
          </div>
        </div>

        <!-- Email Field -->
        <div class="mb-3">
          <label class="form-label text-secondary fw-semibold small">Email Address <span
              class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">✉️</span>
            <input type="text" class="form-control bg-light border-start-0 ps-0" placeholder="Enter your email"
              [(ngModel)]="email" name="email" required />
          </div>
        </div>

        <!-- Password Field -->
        <div class="mb-3">
          <label class="form-label text-secondary fw-semibold small">Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"></span>
            <input [type]="showPassword ? 'text' : 'password'"
              class="form-control bg-light border-start-0 border-end-0 ps-0" placeholder="Enter your password"
              [(ngModel)]="password" name="password" required />
            <button type="button" class="input-group-text bg-light border-start-0 text-muted"
              (click)="toggleShowPassword()">
              {{ showPassword ? '👁️' : '🙈' }}
            </button>
          </div>
        </div>

        <!-- Phone Field (Register mode only) -->
        <div *ngIf="mode === 'register'" class="mb-3">
          <label class="form-label text-secondary fw-semibold small">Phone Number (Optional)</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">📞</span>
            <input type="tel" class="form-control bg-light border-start-0 ps-0" placeholder="Enter your phone number"
              [(ngModel)]="phone" name="phone" />
          </div>
        </div>

        <!-- Address Field (Register mode only) -->
        <div *ngIf="mode === 'register'" class="mb-3">
          <label class="form-label text-secondary fw-semibold small">Delivery Address (Optional)</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">📍</span>
            <textarea class="form-control bg-light border-start-0 ps-0" rows="2" placeholder="Enter your address"
              [(ngModel)]="address" name="address"></textarea>
          </div>
        </div>

        <!-- Quick Demo Account & Admin Fill (Login mode) -->
        <div *ngIf="mode === 'login'" class="d-flex justify-content-between align-items-center mb-3">
          <button type="button" class="btn btn-link btn-sm text-success p-0 text-decoration-none fw-semibold"
            (click)="fillDemoAccount()">
            💡 Customer Demo
          </button>
          <button type="button" class="btn btn-link btn-sm text-primary p-0 text-decoration-none fw-semibold"
            (click)="fillAdminAccount()">
            🛡️ Admin Login
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit"
          class="btn btn-success w-100 py-2.5 rounded-3 fw-bold btn-submit shadow-sm d-flex align-items-center justify-content-center gap-2"
          [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>{{ loading ? (mode === 'login' ? 'Signing In...' : 'Creating Account...') : (mode === 'login' ? 'Sign
            In' : 'Create Account') }}</span>
        </button>
      </form>
    </div>

    <div class="card-footer text-center bg-transparent border-0 pb-4">
      <small class="text-muted">
        By continuing, you agree to Instamart's
        <a href="#" class="text-success text-decoration-none">Terms of Service</a> &
        <a href="#" class="text-success text-decoration-none">Privacy Policy</a>
      </small>
    </div>
  </div>
</div>
